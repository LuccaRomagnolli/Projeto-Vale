[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mining-fleet-alert-anticipation"
version = "0.1.0"
description = "Anticipation of Don't Go alerts for mining fleets"
requires-python = ">=3.11,<3.14"

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# run_eda.py carrega os textos narrativos do relatorio de EDA (descricoes em
# portugues de cada figura). Quebrar essas strings em concatenacao implicita
# prejudicaria a leitura e a busca pelo texto. Nenhuma linha de codigo real
# excede o limite neste arquivo.
"src/eda/run_eda.py" = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
