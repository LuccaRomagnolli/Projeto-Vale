name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run lint
        run: make lint

      - name: Run tests
        run: make test

      - name: Rebuild backtest artifact
        run: make tune-hist-gbdt

      - name: Run temporal stability gate
        run: make gate-stability
